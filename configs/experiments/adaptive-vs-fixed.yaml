schema_version: 1
experiment_id: adaptive-vs-fixed-v1
seed: 7
dataset_manifest: datasets/private/desk-change-set/holdout.json
primary_metrics:
  - change_event_f1
  - idf1
  - last_seen_timestamp_error_seconds
  - latency_p95_ms
ablations:
  scheduler: [fixed, adaptive]
  appearance_embeddings: [false, true]
  association_3d: [false, true]
  depth: [false, true]
  precision: [fp16, fp32]
  discovery_interval: [8, 16, 32, 64]
  uncertainty_threshold: [0.35, 0.5, 0.65]
outputs:
  raw_json: experiment-output/adaptive-vs-fixed/raw
  parquet: experiment-output/adaptive-vs-fixed/results.parquet
  report: experiment-output/adaptive-vs-fixed/report.json
