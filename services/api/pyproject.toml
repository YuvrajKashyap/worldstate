[project]
name = "worldstate-api"
version = "0.1.0"
description = "Local WorldState application coordinator."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116.1",
  "pydantic-settings>=2.10.1",
  "uvicorn[standard]>=0.35.0",
  "worldstate-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldstate_api"]

[tool.uv.sources]
worldstate-core = { workspace = true }
