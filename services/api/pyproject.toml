[project]
name = "worldstate-api"
version = "0.1.0"
description = "Local WorldState application coordinator."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.0,<2",
  "fastapi>=0.141.1,<0.142",
  "numpy>=2.2.0,<3",
  "opencv-python-headless==4.10.0.84",
  "pillow>=11.3.0,<13",
  "psutil>=7.0.0,<8",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "starlette>=1.3.1,<2",
  "typer>=0.16.0,<1",
  "uvicorn[standard]>=0.35.0",
  "worldstate-core",
]

[project.optional-dependencies]
vision = [
  "huggingface-hub>=0.34.0,<1",
  "sam-2==1.0",
  "safetensors>=0.5.3,<1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers>=4.56.0,<5",
]
geometry = [
  "mapanything==1.1.3",
  "open3d>=0.19.0,<1",
  "pycolmap>=3.13.0,<4",
  "trimesh>=4.7.0,<5",
]
evaluation = [
  "pyarrow>=20.0.0,<24",
]

[project.scripts]
worldstate = "worldstate_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldstate_api"]

[tool.uv.sources]
worldstate-core = { workspace = true }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }
mapanything = { git = "https://github.com/facebookresearch/map-anything.git", rev = "9d1db2dd728bd8a10e74b15d2eb646e1bf933791" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.fastapi]
entrypoint = "worldstate_api.main:app"
