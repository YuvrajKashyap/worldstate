[project]
name = "worldstate-core"
version = "0.1.0"
description = "Framework-independent WorldState domain and provider ports."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.2.0,<3",
  "scipy>=1.15.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldstate_core"]
